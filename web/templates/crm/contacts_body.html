<div id="contacts-body">
{{if .}}
<div class="table-scroll">
<table class="responsive-table">
  <thead>
    <tr><th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th></th></tr>
  </thead>
  <tbody>
    {{range .}}
    {{$contactID := .ID}}
    {{$formID := printf "contact-form-%d" $contactID}}
    <form id="{{$formID}}" hx-put="/crm/contacts/{{$contactID}}" hx-target="#contacts-body" hx-swap="outerHTML"></form>
    <tr id="contact-row-{{$contactID}}">
      <td data-label="Name"><input form="{{$formID}}" type="text" name="name" value="{{.Name}}"></td>
      <td data-label="Company"><input form="{{$formID}}" type="text" name="company" value="{{.Company}}"></td>
      <td data-label="Email"><input form="{{$formID}}" type="email" name="email" value="{{.Email}}"></td>
      <td data-label="Phone"><input form="{{$formID}}" type="text" name="phone" value="{{.Phone}}"></td>
      <td data-label="Actions" class="actions-cell">
        <button form="{{$formID}}" type="submit">Save</button>
        <button type="button" hx-post="/portal/send-link/{{$contactID}}" hx-target="#portal-status-{{$contactID}}" hx-swap="innerHTML" class="link-button">Send portal link</button>
        <button type="button" hx-delete="/crm/contacts/{{$contactID}}" hx-target="#contacts-body" hx-swap="outerHTML" hx-confirm="Delete this contact?" class="link-button">Delete</button>
        <span id="portal-status-{{$contactID}}" style="display:block; font-size:0.78rem; color:var(--text-muted); margin-top:0.3rem;"></span>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>
</div>
{{else}}
<p class="empty-state">No contacts yet.</p>
{{end}}
</div>
