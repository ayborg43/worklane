{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        // No stored preference means "follow the OS setting" — the toggle
        // only ever writes an explicit "light" or "dark" once clicked, so a
        // literal "system" here can only be a leftover value from before
        // the three-way Light/Dark/System switch became a single icon.
        var stored = localStorage.getItem("theme");
        if (stored === "system") stored = null;
        var resolved = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", resolved);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Projects, CRM, helpdesk, invoicing, and team chat — all in one place.">
  <title>Worklane</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" id="theme-color-meta" content="#ffffff">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Worklane">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/js/vendor/frappe-gantt.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/vendor/htmx.min.js"></script>
  <script src="/static/js/vendor/htmx-ext-ws.js"></script>
  <script src="/static/js/vendor/alpine.min.js" defer></script>
  <script src="/static/js/vendor/frappe-gantt.min.js"></script>
</head>
<body>
  {{template "nav" .}}
  <main class="container">
    {{template "content" .}}
  </main>
  <script>
    (function () {
      var path = location.pathname;
      document.querySelectorAll(".nav-links a[href]").forEach(function (a) {
        var href = a.getAttribute("href");
        if (href !== "/" && path.indexOf(href) === 0) a.classList.add("active");
      });
    })();
  </script>
  <script>
    (function () {
      function apply(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.getElementById("theme-color-meta");
        if (meta) meta.setAttribute("content", theme === "dark" ? "#201e26" : "#ffffff");
        document.querySelectorAll(".theme-toggle").forEach(function (btn) {
          btn.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
        });
      }
      // A stored value means the visitor explicitly picked a theme via the
      // toggle; its absence means "keep following the OS setting" — same
      // resolution the pre-paint script in <head> already did, repeated
      // here since that one only sets the data-theme attribute and never
      // wires up ongoing behavior (the meta color, the OS-change listener,
      // the click handler).
      var stored = localStorage.getItem("theme");
      if (stored === "system") stored = null;
      apply(stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

      document.querySelectorAll(".theme-toggle").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          localStorage.setItem("theme", next);
          apply(next);
        });
      });
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
        if (!localStorage.getItem("theme")) apply(e.matches ? "dark" : "light");
      });
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
  <script>
    (function () {
      var input = document.querySelector(".search-modal-input");
      if (!input) return;
      var active = -1;
      function items() { return document.querySelectorAll("#search-results .search-result"); }
      function setActive(i) {
        var list = items();
        list.forEach(function (el) { el.classList.remove("active"); });
        active = Math.max(-1, Math.min(i, list.length - 1));
        if (active >= 0) {
          list[active].classList.add("active");
          list[active].scrollIntoView({ block: "nearest" });
        }
      }
      input.addEventListener("keydown", function (e) {
        var list = items();
        if (e.key === "ArrowDown") {
          e.preventDefault();
          setActive(active + 1);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          setActive(active - 1);
        } else if (e.key === "Enter") {
          var target = list[active >= 0 ? active : 0];
          if (target) {
            e.preventDefault();
            location.href = target.getAttribute("href");
          }
        }
      });
      document.body.addEventListener("htmx:afterSwap", function (e) {
        if (e.target && e.target.id === "search-results") active = -1;
      });
    })();
  </script>
</body>
</html>
{{end}}
