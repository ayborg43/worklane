{{define "content"}}
<div class="page-header">
  <h1><a href="/helpdesk" style="color:inherit;">Helpdesk</a> / {{.Ticket.Subject}}</h1>
</div>

{{template "ticket_detail_body.html" .}}

<div class="card">
  <h3 style="margin-top:0;">Comments</h3>
  {{template "comments_section.html" .Comments}}
  <form hx-post="/helpdesk/tickets/{{.Ticket.ID}}/comments" hx-target="#ticket-comments" hx-swap="outerHTML" hx-on::after-request="if (event.detail.successful) this.reset()" class="chat-form" style="margin-top:1rem;">
    <input type="text" name="body" placeholder="Add a comment…" autocomplete="off" required>
    <button type="submit">Comment</button>
  </form>
</div>
{{end}}
