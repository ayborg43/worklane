# Production stack for Dokploy (or any Docker Compose-based host). Point
# Dokploy's Application (type: Docker Compose) at this file — see the
# "Deploying with Dokploy" section in README.md for the full walkthrough.
#
# Required env vars (set these in Dokploy's Environment tab, not here):
#   POSTGRES_PASSWORD  - no default on purpose; deployment fails without it
#   BASE_URL           - e.g. https://worklane.yourdomain.com, used to build
#                         links in emailed notifications
# Optional:
#   POSTGRES_USER, POSTGRES_DB - default to "worklane" below

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-worklane}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-worklane}?sslmode=disable
      ADDR: ":8080"
      COOKIE_SECURE: "true"
      BASE_URL: ${BASE_URL:?BASE_URL is required, e.g. https://worklane.yourdomain.com}
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worklane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-worklane}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worklane}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_data:
  db_data:
